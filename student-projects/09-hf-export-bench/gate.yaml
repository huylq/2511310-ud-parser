# Gate configuration for Project 9: HF Export & Benchmark Harness.
# See student-projects/_gate/README.md for what each step checks.
#
# Only the `export_rows` producer is checked by the mechanical
# schema-conformance step. Benchmark-scoring correctness against
# `tests/fixtures/benchmark/*_stub.jsonl` has no single structural
# contract a generic loader can drive meaningfully -- it is exercised by
# the golden-file test instead.

branch: student/09-hf-export-bench

owned_paths:
  - "src/vietnlp/export/**"
  - "tests/test_export_*.py"
  - "student-projects/09-hf-export-bench/**"
  # `datasets`/`huggingface_hub` are not yet project dependencies -- see
  # the same note in student-projects/08-serving/gate.yaml: additions
  # only, and the scope diff still applies.
  - "pyproject.toml"

forbidden_paths:
  - "src/vietnlp/interfaces/**"
  - "src/vietnlp/platform/**"
  - "src/vietnlp/acquisition/**"
  - "src/vietnlp/curation/**"
  - "src/vietnlp/linguistics/**"
  - "src/vietnlp/ontology/**"
  - "src/vietnlp/semantics/**"
  - "src/vietnlp/oupm/**"
  - "src/vietnlp/treebank/**"
  - "src/vietnlp/serving/**"
  - "tests/fixtures/**"
  - "student-projects/_gate/**"

provenance_field: source

producers:
  - name: export_rows
    module: vietnlp.export.exporter
    function: export_document
    # Real signature to implement: export_document(doc: dict) -> list[ExportRow]
    # `doc` is one row of tests/fixtures/serving/gold_fixture.json's shape.
    call_mode: per_item
    returns: list
    inputs:
      loader: "student-projects/_gate/inputs/09-hf-export-bench.py:build_inputs"
    schema:
      module: vietnlp.interfaces.export
      validator: validate_export_rows
      validator_call_mode: batch

own_test_glob: "tests/test_export_*.py"
golden_test: "tests/golden/test_hf_export_benchmark_golden.py"
min_own_tests: 6
required_input_classes:
  - nfc
  - register
  - degenerate
  - adversarial

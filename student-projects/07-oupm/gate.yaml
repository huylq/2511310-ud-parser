# Gate configuration for Project 7: OUPM Entity Resolution.
# See student-projects/_gate/README.md for what each step checks.

branch: student/07-oupm

owned_paths:
  - "src/vietnlp/oupm/**"
  - "tests/test_oupm_*.py"
  - "student-projects/07-oupm/**"

forbidden_paths:
  - "src/vietnlp/interfaces/**"
  - "src/vietnlp/platform/**"
  - "src/vietnlp/acquisition/**"
  - "src/vietnlp/curation/**"
  - "src/vietnlp/linguistics/**"
  - "src/vietnlp/ontology/**"
  - "tests/fixtures/**"
  - "student-projects/_gate/**"

provenance_field: source

producers:
  - name: entity_clusters
    module: vietnlp.oupm.resolver
    function: cluster
    # Real signature to implement:
    #   cluster(entities: list[NamedEntity], chains: list[CorefChain]) -> list[EntityCluster]
    call_mode: per_item
    returns: list
    inputs:
      loader: "student-projects/_gate/inputs/07-oupm.py:build_inputs"
    schema:
      module: vietnlp.interfaces.oupm
      validator: validate_entity_cluster
      validator_kwargs_loader: "student-projects/_gate/inputs/07-oupm.py:build_known_mention_ids"

own_test_glob: "tests/test_oupm_*.py"
golden_test: "tests/golden/test_oupm_clustering_golden.py"
min_own_tests: 6
required_input_classes:
  - surname
  - diacritic
  - degenerate
  - adversarial

# Gate configuration for Project 8: Serving API.
# See student-projects/_gate/README.md for what each step checks.
#
# No `producers` are configured: `interfaces.serving` objects carry no
# `source` field (see interfaces/serving.py's own docstring for why) and
# have no single pure function a generic loader can drive meaningfully --
# Project 8's deliverable is a running FastAPI app. Schema conformance and
# the "exact fixture rows, UTF-8 round-tripped" golden invariant are both
# enforced entirely by the golden-file test (a `TestClient`-based test
# against `tests/fixtures/serving/gold_fixture.json`), not by steps 3/4.

branch: student/08-serving

owned_paths:
  - "src/vietnlp/serving/**"
  - "tests/test_serving_*.py"
  - "student-projects/08-serving/**"
  # FastAPI/uvicorn/httpx are not yet project dependencies -- you need to
  # add them to pyproject.toml's [project.dependencies] (dependency
  # ADDITIONS only; do not touch or reorder anything else in the file,
  # and the scope diff still applies -- an unrelated change here fails
  # step 1 same as anywhere else).
  - "pyproject.toml"

forbidden_paths:
  - "src/vietnlp/interfaces/**"
  - "src/vietnlp/platform/**"
  - "src/vietnlp/acquisition/**"
  - "src/vietnlp/curation/**"
  - "src/vietnlp/linguistics/**"
  - "src/vietnlp/ontology/**"
  - "src/vietnlp/semantics/**"
  - "src/vietnlp/oupm/**"
  - "src/vietnlp/treebank/**"
  - "tests/fixtures/**"
  - "student-projects/_gate/**"

provenance_field: source

producers: []

own_test_glob: "tests/test_serving_*.py"
golden_test: "tests/golden/test_serving_api_golden.py"
min_own_tests: 6
required_input_classes:
  - ensure_ascii
  - utf-8
  - degenerate
  - adversarial

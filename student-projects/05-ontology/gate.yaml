# Gate configuration for Project 5: Ontology Engineering.
# See student-projects/_gate/README.md for what each step checks.

branch: student/05-ontology

owned_paths:
  - "src/vietnlp/ontology/**"
  - "tests/test_ontology_*.py"
  - "student-projects/05-ontology/**"

forbidden_paths:
  - "src/vietnlp/interfaces/**"
  - "src/vietnlp/platform/**"
  - "src/vietnlp/acquisition/**"
  - "src/vietnlp/curation/**"
  - "src/vietnlp/linguistics/**"
  - "tests/fixtures/**"
  - "student-projects/_gate/**"

provenance_field: source

producers:
  - name: ontology_individuals
    module: vietnlp.ontology.induction
    function: induce_individual
    # Real signature to implement: induce_individual(entity: interfaces.ner.NamedEntity) -> OntologyIndividual
    call_mode: per_item
    returns: single
    inputs:
      loader: "student-projects/_gate/inputs/05-ontology.py:build_inputs"
    schema:
      module: vietnlp.interfaces.ontology
      validator: validate_ontology_individuals
      validator_call_mode: batch

own_test_glob: "tests/test_ontology_*.py"
golden_test: "tests/golden/test_ontology_reasoner_golden.py"
min_own_tests: 6
required_input_classes:
  - kinship
  - closematch
  - degenerate
  - adversarial

# Gate configuration for Project 1: Word Segmentation & POS Tagging.
# See student-projects/_gate/README.md for what each step checks and how
# to run this locally.

branch: student/01-word-seg-pos

owned_paths:
  - "src/vietnlp/linguistics/segmentation.py"
  - "src/vietnlp/linguistics/pos.py"
  - "src/vietnlp/linguistics/__init__.py"
  - "tests/test_linguistics_segmentation*.py"
  - "tests/test_linguistics_pos*.py"
  - "student-projects/01-word-seg-pos/**"

forbidden_paths:
  - "src/vietnlp/interfaces/**"
  - "src/vietnlp/platform/**"
  - "src/vietnlp/acquisition/**"
  - "src/vietnlp/curation/**"
  - "tests/fixtures/**"
  - "student-projects/_gate/**"

provenance_field: source

producers:
  - name: segmented_sentences
    module: vietnlp.linguistics.segmentation
    function: segment
    # Real signature to implement: segment(sent_id: str, register: str, text: str) -> SegmentedSentence
    call_mode: per_item
    returns: single
    inputs:
      loader: "student-projects/_gate/inputs/01-word-seg-pos.py:build_inputs"
    schema:
      module: vietnlp.interfaces.linguistics
      validator: validate_segmented_sentence

own_test_glob: "tests/test_linguistics_segmentation*.py"
golden_test: "tests/golden/test_word_seg_pos_golden.py"
min_own_tests: 6
required_input_classes:
  - formal
  - informal
  - teencode
  - non_diacritic
  - compound
  - degenerate
  - adversarial

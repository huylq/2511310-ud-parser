[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnlp"
version = "0.1.0"
description = "Vietnamese Language Understanding Platform"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp>=2.0,<3",
    "psycopg[binary]>=3.1",
    "pyarrow>=15",
    "minio>=7.2",
    "prefect>=3.0",
    "pandera>=0.20",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21"]

[project.scripts]
vietnlp-agents = "vietnlp.platform.agents.cli:main"
vietnlp-migrate = "vietnlp.platform.db.migrate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vietnlp.platform.db" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

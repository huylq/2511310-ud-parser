[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnlp"
version = "0.1.0"
description = "Project 2: Vietnamese UD Dependency Parsing"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandera>=0.20",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # pyyaml: student-projects/_gate/gate.py reads each project's gate.yaml.
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
